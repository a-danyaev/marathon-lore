meta:
  data_version: '6.0'
  game_patch: Season 2, мид-сезонный патч 1.1.5 (Vault Breaker), 22.07.2026
  captured: '2026-07-16'
  source_priority: 'Приоритет для типа боеприпаса (и по аналогии - для любого спорного поля): 1) внутриигровое
    описание ствола; 2) консенсус ПОДДЕРЖИВАЕМЫХ дисплей-полей >= 2 живых баз (у marathondb - визуальный
    бейдж/type-строка/icon_url, а НЕ устаревший ammo_type slug; плюс tauceti, marathon-guide, dexerto);
    3) выделенные ammo-индекс-страницы wzstats; 4) живой игрок (SlenderBeans) как тайбрейкер и как первичный
    источник там, где базы структурно ничего не трекают (Prestige/Deluxe Cryo-уникумы); 5) понижены в
    правах: замороженный ammo_type slug marathondb и устаревшие SSG stat-блоки - reference-only; 6) неразрешимое
    расхождение >= 2 источников помечается disputed, primary + alt хранятся оба, меньшинство не прячется.'
  counts_note: '38 стволов в черновике B (marathondb: 37 итемизированных страниц + 1 общая /weapons/melee/).
    Финальные 39 = 38 - 1 (V95 Lookout удалён как пре-релизный стаб, вердикт арбитража №3) + 1 (Fist of
    Phobos добавлен, вердикт №4) + 1 (V66 Shepherd добавлен/исправлен, смежная поправка к вердикту №3).'
