meta:
  data_version: '6.0'
  game_patch: Season 2, до мид-сезонного патча Vault Breaker (21.07.2026, на момент сборки ещё не вышел)
  captured: '2026-07-16'
  source_priority: mods.marathondb.gg/api/mods - основной источник по мод-каталогу (89 видимых is_hidden=0
    записей публикуются в mods; is_hidden=1 записи из общего пула 222/221 в датасет не включены). Расхождения
    счётчиков между marathondb.gg/marathondb.info/marathonmeta.gg/helpbot - не разрешаются выбором одного
    числа, а фиксируются в counts_note как отдельные метрики разного охвата. runnerskins.marathondb.gg/api/skins
    - основной источник по skins_overview; аномалии словаря rarity/source (напр. отсутствие enhanced среди
    скинов, common у Rook) публикуются как есть, не сглаживаются под общую 5-ступенчатую шкалу.
mods_system:
  slots_per_weapon:
    observed_range: 2-4 активных слотов на ствол (по 6 образцам)
    observed_samples:
      impact-har: 4
      overrun-ar: 4
      m77-assault-rifle: 3
      v75-scar: 4
      conquest-lmg: 4
      longshot: 4
      ares-rg: 2
    slot_pool:
    - optic
    - chip
    - grip
    - magazine
    - barrel
    note: slot_count в собственном API marathondb.gg (mods.marathondb.gg/api/weapons/{slug}/slots) везде
      возвращает 0 (фича недоделана) - реальные наборы слотов взяты из встроенного RSC-объекта weapon.activeModSlots
      на tauceti.gg/db/weapons/{slug}. shield и generator - НЕ слоты ствола, а отдельные слоты способности
      оружия (привязаны к конкретным пушкам с уникальной механикой, напр. энергощит/чардж).
    src: https://tauceti.gg/db/weapons/{slug} (embedded RSC weapon record, activeModSlots field)
    date: '2026-07-16'
