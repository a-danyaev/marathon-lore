    (Assassin/Destroyer/Recon/Rook/Sentinel/Thief/Triage/Vandal); косметика, чисто внешний вид, на характеристики
    не влияет (не проверялось напрямую - таких заявлений по геймплей-эффекту в данных API нет, что само
    по себе косвенно подтверждает «чистая косметика»)
