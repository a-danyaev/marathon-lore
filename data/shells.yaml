  lore_notes: Rook - не биомата-шелл, а угнанный базовый робото-фрейм, который UESC и корпорации используют
    для ручного труда; Раннеры доустанавливают на него ограниченный по времени нейросинхронизатор, позволяющий
    занимать тело на короткий срок до нейродеградации. Rook лишён апгрейдов через Implants/Cores и никогда
    не достигает полного функционала биокибернетических шеллов. По данным marathonwiki (ссылка на игру),
    Rook-фреймы массово использовались во время корпоративной холодной войны на Tau Ceti IV в 2893 году
    - теглайн 'Lunar work release' на marathondb.gg намекает на происхождение из лунного каторжного труда.
