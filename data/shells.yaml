  lore_notes: 'Triage - разработка корпорации TRAXUS для марсианских шахт: шелл-рабочие давали высокую
    текучку из-за опасных условий, и Triage придумали, чтобы держать их в строю. Разработан совместно
    с UESC и Sekiguchi Genetics ещё до официального дебюта - Раннеры заинтересовались им раньше рынка.
    Личностная серия Aux изначально даёт спокойный «постельный» тон медика, но Раннеры дотюнили её агрессивность
    для боевых условий. По данным marathonwiki (со ссылкой на игру), модели Triage массово применялись
    в корпоративной холодной войне на Tau Ceti IV в 2893 году.'
