    учёных-радикалов в угнанных шеллах UESC три месяца держал оборону от Central Security Agency, которая
    потеряла 27 агентов, прежде чем обрушить тоннели. После утечки тактик Trenchway 3 в среде Раннеров,
    Sentinel стал стандартным инструментом для разведки и исследований. Личностная серия GADGE (Rampart)
    официально признана в Sol нелегальной кражей личности - она скомпилирована из ворованных нейронных
    моделей учёных-механиков Intelligent Design Labs (Стокгольм).'
