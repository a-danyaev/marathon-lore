  lore_notes: 'Серия Glitch родилась из инсуррекционистских операций MIDA на Марсе: кто-то угнал грузовик
    стандартных шеллов, доработал их до Vandal и устроил дневную атаку на конвой UESC («A Dozen Lunatics
    Bumrush UESC Mobile Armory»). Общий вокал-паттерн Glitch затруднял отслеживание конкретных Раннеров
    правоохранителями UESC, а уличная эстетика серии стала молодёжным трендом на Марсе.'
